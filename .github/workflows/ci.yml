name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel previous in-progress runs for the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    env:
      # Use the thorough Hypothesis profile in CI (200 examples, 1s deadline)
      # — see tests/conftest.py.
      HYPOTHESIS_PROFILE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -ra

      - name: Upload run artifacts
        # No-op until the simulation actually writes runs/ — wired now so
        # post-Mesa runs are immediately retrievable from the Checks tab.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
          retention-days: 7
