[project]
name = "hedonism-harness"
version = "0.1.0"
description = "A 2D artificial-life experiment testing whether survival behaviors emerge from inherited pleasure/pain thresholds."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Norsninja" }]

dependencies = [
    "mesa>=3.0,<4",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2,<3",
    "rich>=13",
    "blinker>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "pytest-benchmark>=4",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedonism_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "PL",  # pylint
    "PT",  # flake8-pytest-style
]
ignore = [
    "PLR0913", # too many arguments — common in scientific code
    "PLR2004", # magic numbers — pervasive in trait/world configs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004", # magic numbers — common in test fixtures
    "S101",    # assert use — pytest's primary mechanism
    "PLC0415", # function-local imports — deliberate for TDD-scaffolded red tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "determinism: tests that verify reproducibility under fixed seed",
]
